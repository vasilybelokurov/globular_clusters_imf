[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globular-clusters-imf"
version = "0.1.0"
description = "Inference tools for the Milky Way globular-cluster initial mass function using Baumgardt catalogs."
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds are pinned to the versions the published numbers were produced with.
# These are floating `>=` constraints no longer: an unpinned scientific stack means a
# rerun six months later can silently give different answers (scipy's optimisers and
# numpy's reductions both change), with no record of which version produced which
# result. Widen a bound deliberately, and re-run the tests when you do.
dependencies = [
  "astropy>=6.1,<8",
  "lxml>=5.2,<7",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: refits the full detectability iteration several times (minutes)",
]
